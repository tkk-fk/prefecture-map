<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ちずでおぼえる とどうふけん｜全国版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F1E3; --ink:#5b5142; --ink-soft:#8a7d68; --line:#a99878;
  --pref:#EBDFC3; --pref-line:#a99878; --target:#FFE86B;
  --btn:#FFFFFF; --accent:#7BB6A6; --accent-deep:#4f8b7c; --warn:#E8A87C;
  --shadow:rgba(120,104,74,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden;}
body{
  background:var(--cream); color:var(--ink);
  font-family:"Zen Maru Gothic","BIZ UDPGothic",sans-serif;
  height:100vh; height:100dvh; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none; user-select:none; -webkit-user-select:none;
}
header{flex:0 0 auto;padding:clamp(6px,1.6vw,12px) clamp(10px,3vw,20px) 0;text-align:center;}
.titlerow{display:flex;align-items:baseline;justify-content:center;gap:.6em;flex-wrap:wrap;}
h1{font-size:clamp(16px,4vw,25px);font-weight:900;margin:0;letter-spacing:.02em;}
.region{font-size:clamp(13px,3vw,18px);font-weight:700;color:#fff;background:var(--accent);
  padding:.15em .8em;border-radius:999px;box-shadow:0 3px 0 var(--accent-deep);}
.ovhint{margin-top:clamp(6px,1.4vw,10px);font-size:clamp(14px,3.2vw,19px);font-weight:700;color:var(--ink-soft);}

#rgHead{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.6vw,12px);flex-wrap:wrap;}
.back-btn{font-family:inherit;font-weight:700;font-size:clamp(13px,3vw,18px);color:var(--accent-deep);
  background:var(--btn);border:none;border-radius:14px;padding:.4em .9em;cursor:pointer;
  box-shadow:0 4px 0 var(--shadow);touch-action:manipulation;}
.back-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow);}
.modes{display:flex;gap:clamp(6px,1.6vw,12px);justify-content:center;margin-top:clamp(8px,1.6vw,12px);flex-wrap:wrap;width:100%;}
.mode-btn{font-family:inherit;font-weight:700;font-size:clamp(14px,3.2vw,20px);color:var(--ink);background:var(--btn);
  border:none;padding:.5em 1.05em;border-radius:16px;cursor:pointer;box-shadow:0 5px 0 var(--shadow);
  transition:transform .05s, box-shadow .05s, background .15s;touch-action:manipulation;}
.mode-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow);}
.mode-btn.on{background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-deep);}

#prompt{flex:0 0 auto;min-height:clamp(42px,8.5vw,64px);display:flex;align-items:center;justify-content:center;gap:.5em;flex-wrap:wrap;
  padding:clamp(6px,1.4vw,10px) clamp(10px,3vw,20px);font-size:clamp(16px,4.2vw,25px);font-weight:700;text-align:center;}
#prompt .ask{color:var(--ink);}
#prompt .nk{display:inline-flex;flex-direction:column;align-items:center;line-height:1.04;vertical-align:middle;}
#prompt .nk .nk-kana{color:var(--accent-deep);font-weight:900;}
#prompt .nk .nk-kanji{font-size:.55em;font-weight:700;color:var(--ink-soft);}
#prompt .hint{font-size:1.15em;}
#prompt .feedback.ng{font-size:.8em;font-weight:900;color:var(--warn);}
.speak-btn{font-family:inherit;font-size:.72em;font-weight:700;color:var(--accent-deep);background:var(--btn);
  border:none;border-radius:12px;padding:.25em .7em;cursor:pointer;box-shadow:0 3px 0 var(--shadow);touch-action:manipulation;}
.speak-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow);}

#mapwrap{flex:1 1 auto;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 clamp(6px,2vw,16px);}
#map{width:100%;height:100%;touch-action:manipulation;}
.pref{fill:var(--pref);stroke:var(--pref-line);stroke-width:1.1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;
  transition:fill .25s ease, opacity .3s ease;}
.pref.clickable{cursor:pointer;}
.pref.clickable:active{filter:brightness(.94);}
.pref.dim{opacity:.22;pointer-events:none;}
.pref.target{fill:var(--target)!important;animation:targetpulse 1.1s ease-in-out infinite;}
@keyframes targetpulse{0%,100%{stroke:var(--warn);stroke-width:1.2px;}50%{stroke:#d98a4f;stroke-width:3.5px;}}
.pref.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-3px,0);}40%{transform:translate(3px,0);}60%{transform:translate(-2px,0);}80%{transform:translate(2px,0);}}
#regionLabels text{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;fill:var(--ink);
  paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;text-anchor:middle;pointer-events:none;}
#hintLayer circle{fill:none;stroke:var(--warn);stroke-width:3;opacity:0;}
#hintLayer circle.on{animation:ringpulse 1.2s ease-out infinite;}
@keyframes ringpulse{0%{r:4;opacity:.9;}100%{r:26;opacity:0;}}

#inset{position:absolute;left:clamp(6px,2vw,14px);top:clamp(6px,2vw,14px);width:clamp(74px,17vw,104px);height:clamp(84px,19vw,118px);
  background:rgba(255,255,255,.82);border-radius:14px;box-shadow:0 3px 10px rgba(120,104,74,.2);padding:5px;}
#inset .idot{fill:#d8ccb2;}
#inset .idot.act{fill:var(--accent);}
#inset .iring{fill:none;stroke:var(--accent-deep);stroke-width:10;}
#inset .ilabel{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:80px;fill:var(--accent-deep);text-anchor:middle;
  paint-order:stroke;stroke:#fff;stroke-width:14px;}

#card{position:absolute;left:50%;bottom:clamp(8px,2vw,18px);transform:translateX(-50%) translateY(20px);background:#fff;border-radius:22px;
  padding:clamp(12px,2.6vw,20px) clamp(18px,4vw,30px);box-shadow:0 8px 24px rgba(120,104,74,.28);
  display:none;align-items:center;gap:clamp(12px,3vw,22px);opacity:0;transition:opacity .2s, transform .2s;pointer-events:auto;max-width:92%;}
#card.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0);}
#card .emoji{font-size:clamp(38px,10vw,64px);line-height:1;}
#card .txt{display:flex;flex-direction:column;gap:.1em;}
#card .kana{font-size:clamp(26px,6.6vw,44px);font-weight:900;color:var(--accent-deep);line-height:1.1;}
#card .kanji{font-size:clamp(15px,3.4vw,22px);color:var(--ink-soft);font-weight:700;}
#card .word{font-size:clamp(15px,3.4vw,22px);color:var(--ink);}
#card .cardspeak{font-size:clamp(22px,5vw,32px);background:none;border:none;cursor:pointer;padding:.1em .2em;}
#card .close{position:absolute;top:-12px;right:-8px;width:34px;height:34px;border-radius:50%;background:#fff;border:none;font-size:20px;
  color:var(--ink-soft);cursor:pointer;box-shadow:0 3px 8px rgba(120,104,74,.3);}

#choices{flex:0 0 auto;display:flex;gap:clamp(8px,2vw,14px);justify-content:center;flex-wrap:wrap;padding:clamp(8px,2vw,14px) clamp(10px,3vw,20px);}
.choice{font-family:inherit;font-weight:900;font-size:clamp(17px,4.4vw,25px);color:var(--ink);background:var(--btn);border:none;border-radius:18px;
  padding:.45em 1.05em;cursor:pointer;box-shadow:0 6px 0 var(--shadow);touch-action:manipulation;transition:transform .05s,box-shadow .05s,opacity .2s;
  display:flex;flex-direction:column;align-items:center;gap:.04em;line-height:1.12;}
.choice .c-kana{font-size:1em;font-weight:900;}
.choice .c-kanji{font-size:.6em;font-weight:700;color:var(--ink-soft);}
.choice:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow);}
.choice.dim{opacity:.4;}
.choice.shake{animation:shake .4s;}

footer{flex:0 0 auto;display:flex;gap:clamp(8px,2vw,14px);justify-content:center;padding:clamp(6px,1.4vw,10px) clamp(10px,3vw,20px) clamp(10px,2vw,16px);}
.foot-btn{font-family:inherit;font-weight:700;font-size:clamp(13px,3vw,17px);color:var(--ink);background:var(--btn);border:none;border-radius:14px;
  padding:.45em 1em;cursor:pointer;box-shadow:0 4px 0 var(--shadow);touch-action:manipulation;}
.foot-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow);}
.foot-btn.off{opacity:.5;}

#celebrate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(247,241,227,.82);z-index:5;text-align:center;gap:.4em;}
#celebrate.show{display:flex;}
#celebrate .big{font-size:clamp(30px,8vw,54px);font-weight:900;color:var(--accent-deep);}
#celebrate .sub{font-size:clamp(15px,3.8vw,21px);color:var(--ink);}
#celebrate .again{margin-top:.4em;font-family:inherit;font-weight:900;font-size:clamp(16px,4vw,23px);color:#fff;background:var(--accent);border:none;
  border-radius:18px;padding:.5em 1.3em;cursor:pointer;box-shadow:0 6px 0 var(--accent-deep);touch-action:manipulation;}
#celebrate .again:active{transform:translateY(3px);box-shadow:0 3px 0 var(--accent-deep);}
.confetti{position:absolute;top:-20px;font-size:22px;animation:fall linear forwards;pointer-events:none;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}

body.view-overview #rgHead,body.view-overview #prompt,body.view-overview #inset,body.view-overview #choices{display:none;}
body.view-region #ovHead{display:none;}
body.view-region #regionLabels{display:none;}
.oki-arrow{position:absolute;left:clamp(6px,2vw,14px);bottom:clamp(6px,2vw,14px);z-index:4;font-family:inherit;font-weight:900;
  font-size:clamp(13px,3vw,18px);color:#fff;background:var(--accent);border:none;border-radius:14px;padding:.5em .95em;cursor:pointer;
  box-shadow:0 4px 0 var(--accent-deep);touch-action:manipulation;}
.oki-arrow:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-deep);}
body:not(.view-overview) .oki-arrow{display:none;}

@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition:none !important;}.pref.target{stroke:#d98a4f;stroke-width:3px;}}
</style>

const PREFS = DATA.prefs;

const BYRID = Object.fromEntries(REGIONS.map(r=>[r.id,r]));
const PALETTE=["#EF9A9A","#FFCC80","#FFF59D","#A5D6A7","#80CBC4","#90CAF9","#B39DDB","#F48FB1","#BCAAA4"];
const FULLVB=[0,0,1000,1000];
const OKI_PEEK_VB=[-399.9,847.5,587.6,533.6];
let peek=false;
const okiArrow=document.getElementById('okiArrow');
function toOki(){peek=true;tweenVB(OKI_PEEK_VB,660);okiArrow.textContent='← もどる';}
function toMain(){peek=false;tweenVB(FULLVB,660);okiArrow.textContent='おきなわ ↙';}

const map=document.getElementById('map'), promptEl=document.getElementById('prompt'), choicesEl=document.getElementById('choices');
const card=document.getElementById('card'), hintLayer=document.getElementById('hintLayer'), celebrate=document.getElementById('celebrate');
const regionLabels=document.getElementById('regionLabels'), inset=document.getElementById('inset');
const rgName=document.getElementById('rgName'), resetBtn=document.getElementById('reset');
const groupEls={}; PREFS.forEach(p=>groupEls[p.code]=map.querySelector('.pref[data-code="'+p.code+'"]'));

let view='overview', activeRegion=null, mode='miru';
let done=new Set(), seenSet=new Set(), regionDone=new Set(), target=null, wrongCount=0;
let currentVB=FULLVB.slice();

/* sound */
let ac=null, soundOn=true; try{soundOn=localStorage.getItem('tkk_prefmap_sound')!=='off';}catch(e){}
function ctx(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return ac; }
function tone(f,s,d,t,v){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);const n=a.currentTime+s;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.18,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d+.02);}
function sCorrect(){if(soundOn){tone(660,0,.14,'sine',.2);tone(880,.1,.22,'sine',.2);}}
function sWrong(){if(soundOn)tone(300,0,.18,'triangle',.16);}
function sTap(){if(soundOn)tone(520,0,.09,'sine',.12);}
function sComplete(){if(soundOn)[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3,'sine',.2));}

/* speech (output only, feature-detected) */
let ttsVoice=null;
function pickVoice(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();ttsVoice=vs.find(v=>/ja(-|_)?JP/i.test(v.lang))||vs.find(v=>/^ja/i.test(v.lang))||null;document.querySelectorAll('.speak-btn,.cardspeak').forEach(b=>b.style.display=ttsVoice?'':'none');}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t){if(!soundOn||!ttsVoice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=ttsVoice;u.lang=ttsVoice.lang;u.rate=.85;u.pitch=1.05;speechSynthesis.speak(u);}catch(e){}}

/* helpers */
function nameHTML(p){return '<span class="nk"><span class="nk-kana">'+p.kana+'</span><span class="nk-kanji">'+p.kanji+'</span></span>';}
function emojiHTML(p){return p.img||p.emoji;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shakeEl(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
function members(){return BYRID[activeRegion].members.map(c=>BYCODE[c]);}
function remaining(){return members().filter(p=>!done.has(p.code));}
function colorPref(code){const idx=PREFS.findIndex(p=>p.code===code);groupEls[code].style.fill=PALETTE[idx%PALETTE.length];}

/* viewBox tween */
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function setVB(a){map.setAttribute('viewBox',a.join(' '));currentVB=a.slice();}
function tweenVB(to,dur){
  if(reduceMotion){setVB(to);return;}
  const from=currentVB.slice(),t0=(performance&&performance.now)?performance.now():Date.now();dur=dur||560;
  function step(now){let p=Math.min(1,((now||Date.now())-t0)/dur);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    map.setAttribute('viewBox',from.map((v,i)=>v+(to[i]-v)*e).join(' '));
    if(p<1)requestAnimationFrame(step);else currentVB=to.slice();}
  requestAnimationFrame(step);
}

/* ---------- OVERVIEW ---------- */
function renderOverview(){
  view='overview';activeRegion=null;target=null;
  document.body.className='view-overview';
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('on'));
  hintLayer.innerHTML='';choicesEl.innerHTML='';hideCard();celebrate.classList.remove('show');
  PREFS.forEach(p=>{const el=groupEls[p.code];el.classList.remove('dim','target','clickable','shake');el.style.fill=BYRID[p.rg].tint;el.classList.add('clickable');});
  // region labels
  regionLabels.innerHTML='';
  REGIONS.forEach(r=>{
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',r.cx);t.setAttribute('y',r.cy);t.setAttribute('font-size','21');
    t.textContent=(regionDone.has(r.id)?'⭐':'')+r.kana;
    regionLabels.appendChild(t);
  });
  resetBtn.textContent='ぜんぶ けす';
  peek=false;okiArrow.textContent='おきなわ ↙';
  tweenVB(FULLVB,520);
}

/* ---------- REGION ---------- */
function buildInset(){
  inset.innerHTML='';
  REGIONS.forEach(r=>{
    const ix=Math.max(60,Math.min(940,r.cx)), iy=Math.max(60,Math.min(940,r.cy));
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',ix);c.setAttribute('cy',iy);c.setAttribute('r',r.id===activeRegion?46:30);
    c.setAttribute('class','idot'+(r.id===activeRegion?' act':''));inset.appendChild(c);
  });
  const a=BYRID[activeRegion];
  const ax=Math.max(60,Math.min(940,a.cx)), ay=Math.max(60,Math.min(940,a.cy));
  const ring=document.createElementNS('http://www.w3.org/2000/svg','circle');
  ring.setAttribute('cx',ax);ring.setAttribute('cy',ay);ring.setAttribute('r',62);ring.setAttribute('class','iring');inset.appendChild(ring);
}
function enterRegion(rid){
  if(!ac)ctx();
  view='region';activeRegion=rid;document.body.className='view-region';
  rgName.textContent=BYRID[rid].kana;
  const mem=new Set(BYRID[rid].members);
  PREFS.forEach(p=>{const el=groupEls[p.code];el.classList.remove('target','shake');el.style.fill='';
    if(mem.has(p.code)){el.classList.remove('dim');el.classList.add('clickable');}
    else{el.classList.add('dim');el.classList.remove('clickable');}});
  buildInset();
  tweenVB(BYRID[rid].vb,560);
  resetBtn.textContent='さいしょから';
  setMode('miru');
}
function backToOverview(){renderOverview();}

function setMode(m){
  mode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  done.clear();seenSet.clear();target=null;wrongCount=0;
  members().forEach(p=>groupEls[p.code].style.fill='');
  hintLayer.innerHTML='';choicesEl.innerHTML='';hideCard();celebrate.classList.remove('show');
  members().forEach(p=>groupEls[p.code].classList.toggle('clickable', m!=='iu'));
  if(m==='miru')promptEl.innerHTML='<span class="ask">けんを タップしてみよう</span>';
  if(m==='sagasu')nextSagasu();
  if(m==='iu')nextIu();
}

function hideCard(){card.classList.remove('show');}
function showCard(p){card.querySelector('.emoji').innerHTML=emojiHTML(p);card.querySelector('.kana').textContent=p.kana;card.querySelector('.kanji').textContent=p.kanji;card.querySelector('.word').innerHTML=emojiHTML(p)+' '+p.word;card.classList.add('show');}

function miruTap(code){const p=BYCODE[code];showCard(p);sTap();speak(p.say);if(!seenSet.has(code)){seenSet.add(code);colorPref(code);}if(seenSet.size===members().length)promptEl.innerHTML='<span class="ask">この ちほう ぜんぶ みたね！ ✨</span>';}

function nextSagasu(){
  const rem=remaining();
  if(rem.length===0){finishRegion('ぜんぶ みつけたね！');return;}
  target=rem[Math.floor(Math.random()*rem.length)];wrongCount=0;
  promptEl.innerHTML='<span class="hint">'+emojiHTML(target)+'</span> '+nameHTML(target)+' <span class="ask">は どこ？</span> <button class="speak-btn">🔊</button>';
  const sb=promptEl.querySelector('.speak-btn');if(sb){sb.onclick=()=>speak(target.say+'は どこ');if(!ttsVoice)sb.style.display='none';}
  speak(target.say+'は どこ');
}
function sagasuTap(code){
  if(!target)return;
  if(code===target.code){
    colorPref(code);sCorrect();hintLayer.innerHTML='';const p=BYCODE[code];done.add(code);target=null;
    promptEl.innerHTML='<span class="ask">せいかい！</span> '+nameHTML(p)+' <span class="hint">'+emojiHTML(p)+'</span>';
    setTimeout(nextSagasu,900);
  }else{
    wrongCount++;sWrong();shakeEl(groupEls[code]);
    if(!promptEl.querySelector('.feedback')){const fb=document.createElement('span');fb.className='feedback ng';fb.textContent=' ちがうよ';promptEl.appendChild(fb);}
    if(wrongCount>=2)showHint(target);
  }
}
function showHint(p){hintLayer.innerHTML='';const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p.cx);c.setAttribute('cy',p.cy);c.setAttribute('r',4);c.classList.add('on');hintLayer.appendChild(c);}

function iuChoiceSet(t){
  let pool=shuffle(members().filter(p=>p.code!==t.code)).slice(0,2);
  if(pool.length<2){const extra=shuffle(PREFS.filter(p=>p.code!==t.code&&!pool.some(q=>q.code===p.code))).slice(0,2-pool.length);pool=pool.concat(extra);}
  return shuffle([t,...pool]);
}
function nextIu(){
  const rem=remaining();
  if(rem.length===0){finishRegion('ぜんぶ こたえられたね！');return;}
  target=rem[Math.floor(Math.random()*rem.length)];wrongCount=0;
  members().forEach(p=>groupEls[p.code].classList.remove('target'));
  groupEls[target.code].classList.add('target');
  promptEl.innerHTML='<span class="hint">'+emojiHTML(target)+'</span> <span class="ask">ここは なんていう けん？</span>';
  choicesEl.innerHTML='';
  iuChoiceSet(target).forEach(p=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<span class="c-kana">'+p.kana+'</span><span class="c-kanji">'+p.kanji+'</span>';b.onclick=()=>iuChoose(p.code,b);choicesEl.appendChild(b);});
}
function iuChoose(code,btn){
  if(!target)return;
  if(code===target.code){
    groupEls[target.code].classList.remove('target');colorPref(target.code);sCorrect();done.add(target.code);
    const p=BYCODE[target.code];promptEl.innerHTML='<span class="ask">せいかい！</span> '+nameHTML(p)+' <span class="hint">'+emojiHTML(p)+'</span>';speak(p.say);
    choicesEl.innerHTML='';target=null;setTimeout(nextIu,900);
  }else{sWrong();shakeEl(btn);btn.classList.add('dim');}
}

function finishRegion(msg){
  target=null;members().forEach(p=>groupEls[p.code].classList.remove('clickable'));
  regionDone.add(activeRegion);
  celebrate.querySelector('.sub').textContent=msg;celebrate.classList.add('show');sComplete();
  for(let i=0;i<18;i++){const c=document.createElement('div');c.className='confetti';c.textContent=['🎉','⭐','🌸','🎈','✨'][i%5];c.style.left=(Math.random()*100)+'%';c.style.animationDuration=(1.6+Math.random()*1.4)+'s';c.style.animationDelay=(Math.random()*.6)+'s';celebrate.appendChild(c);setTimeout(()=>c.remove(),3600);}
}

/* events */
map.addEventListener('pointerup',e=>{const g=e.target.closest('.pref');if(!g)return;const code=g.dataset.code;
  if(view==='overview'){enterRegion(BYCODE[code].rg);return;}
  if(mode==='miru')miruTap(code);else if(mode==='sagasu')sagasuTap(code);});
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{if(!ac)ctx();setMode(b.dataset.mode);}));
document.getElementById('back').addEventListener('click',backToOverview);
okiArrow.addEventListener('click',()=>{if(!ac)ctx();peek?toMain():toOki();});
card.querySelector('.close').addEventListener('click',hideCard);
card.querySelector('.cardspeak').addEventListener('click',()=>{const p=PREFS.find(x=>x.kana===card.querySelector('.kana').textContent);if(p)speak(p.say);});
celebrate.querySelector('.again').addEventListener('click',()=>setMode(mode));
resetBtn.addEventListener('click',()=>{if(view==='region')setMode(mode);else{regionDone.clear();renderOverview();}});
const soundBtn=document.getElementById('sound');
function reflectSound(){soundBtn.textContent=(soundOn?'🔊':'🔇')+' おと';soundBtn.classList.toggle('off',!soundOn);}
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;try{localStorage.setItem('tkk_prefmap_sound',soundOn?'on':'off');}catch(e){}reflectSound();if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel();});
reflectSound();

renderOverview();
</script>
</body>
</html>
