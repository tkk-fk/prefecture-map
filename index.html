<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ちずでおぼえる とどうふけん｜ちゅうぶちほう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F1E3;
  --ink:#5b5142;
  --ink-soft:#8a7d68;
  --line:#a99878;
  --pref:#EBDFC3;
  --pref-line:#a99878;
  --target:#FFE86B;
  --btn:#FFFFFF;
  --accent:#7BB6A6;
  --accent-deep:#4f8b7c;
  --warn:#E8A87C;
  --shadow:rgba(120,104,74,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:"Zen Maru Gothic","BIZ UDPGothic",sans-serif;
  height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;
  user-select:none; -webkit-user-select:none;
}

/* ---------- header ---------- */
header{
  flex:0 0 auto;
  padding:clamp(6px,1.6vw,12px) clamp(10px,3vw,20px) 0;
  text-align:center;
}
.titlerow{display:flex;align-items:baseline;justify-content:center;gap:.6em;flex-wrap:wrap;}
h1{font-size:clamp(17px,4.2vw,26px);font-weight:900;margin:0;letter-spacing:.02em;}
.region{font-size:clamp(13px,3vw,18px);font-weight:700;color:#fff;background:var(--accent);
  padding:.15em .8em;border-radius:999px;box-shadow:0 3px 0 var(--accent-deep);}

.modes{display:flex;gap:clamp(6px,1.6vw,12px);justify-content:center;margin-top:clamp(8px,1.8vw,14px);flex-wrap:wrap;}
.mode-btn{
  font-family:inherit;font-weight:700;font-size:clamp(15px,3.4vw,20px);
  color:var(--ink);background:var(--btn);border:none;
  padding:.5em 1.1em;border-radius:16px;cursor:pointer;
  box-shadow:0 5px 0 var(--shadow); transition:transform .05s, box-shadow .05s, background .15s;
  touch-action:manipulation;
}
.mode-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow);}
.mode-btn.on{background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-deep);}

/* ---------- prompt ---------- */
#prompt{
  flex:0 0 auto;min-height:clamp(44px,9vw,66px);
  display:flex;align-items:center;justify-content:center;gap:.5em;flex-wrap:wrap;
  padding:clamp(6px,1.6vw,12px) clamp(10px,3vw,20px);
  font-size:clamp(17px,4.4vw,26px);font-weight:700;text-align:center;
}
#prompt .ask{color:var(--ink);}
#prompt .name{color:var(--accent-deep);font-weight:900;}
#prompt .nk{display:inline-flex;flex-direction:column;align-items:center;line-height:1.04;vertical-align:middle;}
#prompt .nk .nk-kana{color:var(--accent-deep);font-weight:900;}
#prompt .nk .nk-kanji{font-size:.55em;font-weight:700;color:var(--ink-soft);}
#prompt .hint{font-size:1.15em;}
.speak-btn{
  font-family:inherit;font-size:.72em;font-weight:700;color:var(--accent-deep);
  background:var(--btn);border:none;border-radius:12px;padding:.25em .7em;cursor:pointer;
  box-shadow:0 3px 0 var(--shadow);touch-action:manipulation;
}
.speak-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow);}
#prompt .feedback{font-size:.8em;font-weight:900;}
#prompt .feedback.ng{color:var(--warn);}

/* ---------- map ---------- */
#mapwrap{flex:1 1 auto;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 clamp(6px,2vw,16px);}
#map{width:100%;height:100%;touch-action:manipulation;}
.pref{
  fill:var(--pref); stroke:var(--pref-line);
  stroke-width:1.4px; vector-effect:non-scaling-stroke;
  stroke-linejoin:round; cursor:pointer;
  transition:fill .25s ease;
}
.pref.clickable:active{filter:brightness(.94);}
.pref.target{fill:var(--target);animation:targetpulse 1.1s ease-in-out infinite;}
@keyframes targetpulse{0%,100%{stroke:var(--warn);stroke-width:1.4px;}50%{stroke:#d98a4f;stroke-width:3.5px;}}
.pref.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-3px,0);}40%{transform:translate(3px,0);}60%{transform:translate(-2px,0);}80%{transform:translate(2px,0);}}
#hintLayer circle{fill:none;stroke:var(--warn);stroke-width:3;opacity:0;}
#hintLayer circle.on{animation:ringpulse 1.2s ease-out infinite;}
@keyframes ringpulse{0%{r:4;opacity:.9;}100%{r:26;opacity:0;}}

/* ---------- miru card ---------- */
#card{
  position:absolute;left:50%;bottom:clamp(8px,2vw,18px);transform:translateX(-50%) translateY(20px);
  background:#fff;border-radius:22px;padding:clamp(12px,2.6vw,20px) clamp(18px,4vw,30px);
  box-shadow:0 8px 24px rgba(120,104,74,.28);
  display:none;align-items:center;gap:clamp(12px,3vw,22px);
  opacity:0;transition:opacity .2s, transform .2s;pointer-events:auto;max-width:92%;
}
#card.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0);}
#card .emoji{font-size:clamp(38px,10vw,64px);line-height:1;}
#card .txt{display:flex;flex-direction:column;gap:.1em;}
#card .kana{font-size:clamp(26px,6.6vw,44px);font-weight:900;color:var(--accent-deep);line-height:1.1;}
#card .kanji{font-size:clamp(15px,3.4vw,22px);color:var(--ink-soft);font-weight:700;}
#card .word{font-size:clamp(15px,3.4vw,22px);color:var(--ink);}
#card .cardspeak{font-size:clamp(22px,5vw,32px);background:none;border:none;cursor:pointer;padding:.1em .2em;}
#card .close{position:absolute;top:-12px;right:-8px;width:34px;height:34px;border-radius:50%;
  background:#fff;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;
  box-shadow:0 3px 8px rgba(120,104,74,.3);}

/* ---------- choices (iu) ---------- */
#choices{flex:0 0 auto;display:flex;gap:clamp(8px,2vw,14px);justify-content:center;flex-wrap:wrap;
  padding:clamp(8px,2vw,14px) clamp(10px,3vw,20px);min-height:0;}
.choice{
  font-family:inherit;font-weight:900;font-size:clamp(18px,4.6vw,26px);color:var(--ink);
  background:var(--btn);border:none;border-radius:18px;padding:.45em 1.1em;cursor:pointer;
  box-shadow:0 6px 0 var(--shadow);touch-action:manipulation;transition:transform .05s,box-shadow .05s,opacity .2s;
  display:flex;flex-direction:column;align-items:center;gap:.04em;line-height:1.12;
}
.choice .c-kana{font-size:1em;font-weight:900;}
.choice .c-kanji{font-size:.6em;font-weight:700;color:var(--ink-soft);}
.choice:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow);}
.choice.dim{opacity:.4;}
.choice.shake{animation:shake .4s;}

/* ---------- footer ---------- */
footer{flex:0 0 auto;display:flex;gap:clamp(8px,2vw,14px);justify-content:center;
  padding:clamp(6px,1.6vw,10px) clamp(10px,3vw,20px) clamp(10px,2vw,16px);}
.foot-btn{font-family:inherit;font-weight:700;font-size:clamp(13px,3vw,17px);color:var(--ink);
  background:var(--btn);border:none;border-radius:14px;padding:.45em 1em;cursor:pointer;
  box-shadow:0 4px 0 var(--shadow);touch-action:manipulation;}
.foot-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow);}
.foot-btn.off{opacity:.5;}

/* ---------- celebrate ---------- */
#celebrate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;background:rgba(247,241,227,.82);z-index:5;text-align:center;gap:.4em;}
#celebrate.show{display:flex;}
#celebrate .big{font-size:clamp(34px,9vw,60px);font-weight:900;color:var(--accent-deep);}
#celebrate .sub{font-size:clamp(16px,4vw,22px);color:var(--ink);}
#celebrate .again{margin-top:.4em;font-family:inherit;font-weight:900;font-size:clamp(17px,4.2vw,24px);
  color:#fff;background:var(--accent);border:none;border-radius:18px;padding:.5em 1.4em;cursor:pointer;
  box-shadow:0 6px 0 var(--accent-deep);touch-action:manipulation;}
#celebrate .again:active{transform:translateY(3px);box-shadow:0 3px 0 var(--accent-deep);}
.confetti{position:absolute;top:-20px;font-size:22px;animation:fall linear forwards;pointer-events:none;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition:none !important;}
  .pref.target{stroke:#d98a4f;stroke-width:3px;}
}
</style>
</head>
<body>
<header>
  <div class="titlerow"><h1>ちずでおぼえる とどうふけん</h1><span class="region">ちゅうぶちほう</span></div>
  <div class="modes">
    <button class="mode-btn" data-mode="miru">みる</button>
    <button class="mode-btn" data-mode="sagasu">さがす</button>

<div id="prompt"></div>

<main id="mapwrap">

    <g id="hintLayer"></g>
  </svg>

  <div id="card">
    <button class="close" aria-label="とじる">✕</button>
    <div class="emoji"></div>
    <div class="txt"><span class="kana"></span><span class="kanji"></span><span class="word"></span></div>
    <button class="cardspeak" aria-label="きく">🔊</button>
  </div>

  <div id="celebrate">
    <div class="big">できたね！🎉</div>
    <div class="sub"></div>
    <button class="again">もういちど</button>
  </div>
</main>

<div id="choices"></div>

<footer>
  <button class="foot-btn" id="reset">さいしょから</button>
  <button class="foot-btn" id="sound">🔊 おと</button>
</footer>

<script>
"use strict";
const PREFS = [
  {code:"15",kana:"にいがた",kanji:"新潟県",emoji:"🍚",word:"おこめ",cx:548.6,cy:538.1},
  {code:"16",kana:"とやま",kanji:"富山県",emoji:"🍣",word:"ますずし",cx:473.0,cy:603.9},
  {code:"17",kana:"いしかわ",kanji:"石川県",emoji:"✨",word:"きんぱく",cx:448.9,cy:593.1},
  {code:"18",kana:"ふくい",kanji:"福井県",emoji:"🦕",word:"きょうりゅう",cx:414.4,cy:655.4},
  {code:"19",kana:"やまなし",kanji:"山梨県",emoji:"🍇",word:"ぶどう",cx:545.0,cy:671.8},
  {code:"20",kana:"ながの",kanji:"長野県",emoji:"🍎",word:"りんご",cx:512.6,cy:637.3},
  {code:"21",kana:"ぎふ",kanji:"岐阜県",emoji:"🏠",word:"しらかわごう",cx:457.1,cy:657.4},
  {code:"22",kana:"しずおか",kanji:"静岡県",emoji:"🍵",word:"おちゃ",cx:528.1,cy:701.1},
  {code:"23",kana:"あいち",kanji:"愛知県",emoji:"🚗",word:"くるま",cx:472.0,cy:708.8}
];
const BYCODE = Object.fromEntries(PREFS.map(p=>[p.code,p]));
const PALETTE = ["#EF9A9A","#FFCC80","#FFF59D","#A5D6A7","#80CBC4","#90CAF9","#B39DDB","#F48FB1","#BCAAA4"];

const map = document.getElementById('map');
const promptEl = document.getElementById('prompt');
const choicesEl = document.getElementById('choices');
const card = document.getElementById('card');
const hintLayer = document.getElementById('hintLayer');
const celebrate = document.getElementById('celebrate');
const groupEls = {};
PREFS.forEach(p=>{ groupEls[p.code] = map.querySelector('.pref[data-code="'+p.code+'"]'); });

let mode='miru';
let done=new Set();
let target=null;
let wrongCount=0;
let seenSet=new Set();

/* ---------- sound (Web Audio) ---------- */
let ac=null, soundOn=true;
try{ soundOn = localStorage.getItem('tkk_prefmap_sound')!=='off'; }catch(e){}
function ctx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ac; }
function tone(freq,start,dur,type,vol){
  const a=ctx(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  o.connect(g); g.connect(a.destination);
  const t=a.currentTime+start;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||0.18,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.02);
}
function sCorrect(){ if(!soundOn)return; tone(660,0,.14,'sine',.2); tone(880,.1,.22,'sine',.2); }
function sWrong(){ if(!soundOn)return; tone(300,0,.18,'triangle',.16); }
function sTap(){ if(!soundOn)return; tone(520,0,.09,'sine',.12); }
function sComplete(){ if(!soundOn)return; [523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3,'sine',.2)); }

/* ---------- speech (optional, output only, feature-detected) ---------- */
let ttsVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices();
  ttsVoice = vs.find(v=>/ja(-|_)?JP/i.test(v.lang)) || vs.find(v=>/^ja/i.test(v.lang)) || null;
  document.querySelectorAll('.speak-btn,.cardspeak').forEach(b=>{ b.style.display = ttsVoice? '' : 'none'; });
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text){
  if(!soundOn||!ttsVoice) return;
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.voice=ttsVoice; u.lang=ttsVoice.lang; u.rate=.85; u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- helpers ---------- */
function clearBoard(){
  PREFS.forEach(p=>{ const el=groupEls[p.code]; el.style.fill=''; el.classList.remove('target','shake','clickable'); });
  hintLayer.innerHTML=''; done.clear(); seenSet.clear(); target=null; wrongCount=0;
  hideCard(); celebrate.classList.remove('show'); choicesEl.innerHTML='';
}
function colorPref(code){
  const idx=PREFS.findIndex(p=>p.code===code);
  groupEls[code].style.fill=PALETTE[idx%PALETTE.length];
}
function setClickable(on){
  PREFS.forEach(p=>groupEls[p.code].classList.toggle('clickable',on));
}
function hideCard(){ card.classList.remove('show'); }
function showCard(p){
  card.querySelector('.emoji').textContent=p.emoji;
  card.querySelector('.kana').textContent=p.kana;
  card.querySelector('.kanji').textContent=p.kanji;
  card.querySelector('.word').textContent=p.emoji+' '+p.word;
  card.classList.add('show');
}
function remaining(){ return PREFS.filter(p=>!done.has(p.code)); }
function nameHTML(p){ return '<span class="nk"><span class="nk-kana">'+p.kana+'</span><span class="nk-kanji">'+p.kanji+'</span></span>'; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function shakeEl(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ---------- modes ---------- */
function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  clearBoard();
  if(m==='miru'){ setClickable(true); promptEl.innerHTML='<span class="ask">けんを タップしてみよう</span>'; }
  if(m==='sagasu'){ setClickable(true); nextSagasu(); }
  if(m==='iu'){ setClickable(false); nextIu(); }
}

/* みる */
function miruTap(code){
  const p=BYCODE[code]; showCard(p); sTap(); speak(p.kana+'けん');
  if(!seenSet.has(code)){ seenSet.add(code); colorPref(code); }
  if(seenSet.size===PREFS.length){
    promptEl.innerHTML='<span class="ask">ぜんぶ みたね！ ✨</span>';
  }
}

/* さがす：なまえ→ばしょ */
function nextSagasu(){
  const rem=remaining();
  if(rem.length===0){ finish('ぜんぶ みつけたね！'); return; }
  target=rem[Math.floor(Math.random()*rem.length)]; wrongCount=0;
  promptEl.innerHTML='<span class="hint">'+target.emoji+'</span> '+nameHTML(target)+' <span class="ask">は どこ？</span> <button class="speak-btn">🔊</button>';
  const sb=promptEl.querySelector('.speak-btn'); if(sb) sb.onclick=()=>speak(target.kana+'けんは どこ');
  if(!ttsVoice&&sb) sb.style.display='none';
  speak(target.kana+'けんは どこ');
}
function sagasuTap(code){
  if(!target) return;
  if(code===target.code){
    colorPref(code); sCorrect(); hintLayer.innerHTML='';
    const p=BYCODE[code];
    done.add(code); target=null;
    promptEl.innerHTML='<span class="ask">せいかい！</span> '+nameHTML(p)+' <span class="hint">'+p.emoji+'</span>';
    setTimeout(nextSagasu,900);
  } else {
    wrongCount++; sWrong(); shakeEl(groupEls[code]);
    const fb=document.createElement('span'); fb.className='feedback ng'; fb.textContent=' ちがうよ';
    if(!promptEl.querySelector('.feedback')) promptEl.appendChild(fb);
    if(wrongCount>=2) showHint(target);
  }
}
function showHint(p){
  hintLayer.innerHTML='';
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',p.cx); c.setAttribute('cy',p.cy); c.setAttribute('r',4);
  c.classList.add('on'); hintLayer.appendChild(c);
}

/* なんていう？：ばしょ→なまえ */
function nextIu(){
  const rem=remaining();
  if(rem.length===0){ finish('ぜんぶ こたえられたね！'); return; }
  target=rem[Math.floor(Math.random()*rem.length)]; wrongCount=0;
  PREFS.forEach(p=>groupEls[p.code].classList.remove('target'));
  groupEls[target.code].classList.add('target');
  promptEl.innerHTML='<span class="hint">'+target.emoji+'</span> <span class="ask">ここは なんていう けん？</span>';
  const others=shuffle(PREFS.filter(p=>p.code!==target.code)).slice(0,2);
  const opts=shuffle([target,...others]);
  choicesEl.innerHTML='';
  opts.forEach(p=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML='<span class="c-kana">'+p.kana+'</span><span class="c-kanji">'+p.kanji+'</span>';
    b.onclick=()=>iuChoose(p.code,b); choicesEl.appendChild(b);
  });
}
function iuChoose(code,btn){
  if(!target) return;
  if(code===target.code){
    groupEls[target.code].classList.remove('target');
    colorPref(target.code); sCorrect(); done.add(target.code);
    const p=BYCODE[target.code];
    promptEl.innerHTML='<span class="ask">せいかい！</span> '+nameHTML(p)+' <span class="hint">'+p.emoji+'</span>';
    speak(p.kana+'けん');
    choicesEl.innerHTML='';
    setTimeout(nextIu,900);
  } else {
    sWrong(); shakeEl(btn); btn.classList.add('dim');
  }
}

/* ---------- finish ---------- */
function finish(msg){
  target=null; setClickable(false);
  celebrate.querySelector('.sub').textContent=msg;
  celebrate.classList.add('show'); sComplete();
  for(let i=0;i<18;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.textContent=['🎉','⭐','🌸','🎈','✨'][i%5];
    c.style.left=(Math.random()*100)+'%';
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    c.style.animationDelay=(Math.random()*.6)+'s';
    celebrate.appendChild(c);
    setTimeout(()=>c.remove(),3600);
  }
}

/* ---------- events ---------- */
map.addEventListener('pointerup',e=>{
  const g=e.target.closest('.pref'); if(!g) return;
  const code=g.dataset.code;
  if(mode==='miru') miruTap(code);
  else if(mode==='sagasu') sagasuTap(code);
});
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{ if(!ac)ctx(); setMode(b.dataset.mode); }));
card.querySelector('.close').addEventListener('click',hideCard);
card.querySelector('.cardspeak').addEventListener('click',()=>{ const k=card.querySelector('.kana').textContent; speak(k+'けん'); });
document.getElementById('reset').addEventListener('click',()=>setMode(mode));
celebrate.querySelector('.again').addEventListener('click',()=>setMode(mode));
const soundBtn=document.getElementById('sound');
function reflectSound(){ soundBtn.textContent=(soundOn?'🔊':'🔇')+' おと'; soundBtn.classList.toggle('off',!soundOn); }
soundBtn.addEventListener('click',()=>{ soundOn=!soundOn; try{localStorage.setItem('tkk_prefmap_sound',soundOn?'on':'off');}catch(e){} reflectSound(); if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel(); });
reflectSound();

setMode('miru');
</script>
